[project]
name = "ai-model-routing-policy"
version = "0.1.0"
description = "Auditable local model routing with held-out evaluation"
requires-python = ">=3.11"
license = "MIT"
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
[tool.mypy]
files = ["routing"]
ignore_missing_imports = true
check_untyped_defs = true
[tool.coverage.run]
branch = true
source = ["routing"]
omit = ["routing/local.py"]
[tool.coverage.report]
fail_under = 85
show_missing = true
